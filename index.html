<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WareTrack v5.2.1 · Riverside Logistics Park</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5.2.1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%232f56e0'/%3E%3Cpath d='M16 9l6 3.5v7L16 23l-6-3.5v-7z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <header class="topbar">
    <div class="brand" id="brand"></div>
    <div class="search">
      <span id="searchIcon"></span>
      <input id="searchInput" type="text" placeholder="Search sites, trucks, forklifts, pallets, shipments…" autocomplete="off" spellcheck="false" />
      <kbd>/</kbd>
      <div class="search-results dropdown" id="searchResults"></div>
    </div>
    <div class="spacer"></div>
    <div class="site-wrap">
      <button class="site-pill" id="sitePill" title="Overview of the park"></button>
    </div>
    <div class="live-pill"><span class="live-dot"></span>Live <span id="clock">09:42</span></div>
    <div class="bell-wrap">
      <button class="icon-btn" id="bellBtn" title="Activity"></button>
      <div class="dropdown menu notif" id="notifMenu"></div>
    </div>
    <div class="user">
      <div class="avatar"><svg viewBox="0 0 40 40"><defs><linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdd7ff"/><stop offset="1" stop-color="#9fb0f5"/></linearGradient></defs><circle cx="20" cy="20" r="20" fill="url(#av)"/><circle cx="20" cy="16" r="7" fill="#f0c7a0"/><path d="M12.5 14.5c0-6 15-6 15 0-1.5-3-13.5-3-15 0z" fill="#2b2f45"/><path d="M6 36c2-8 8-11 14-11s12 3 14 11" fill="#2f56e0"/><path d="M17 25l3 5 3-5" fill="#fff"/></svg></div>
      <div class="user-txt"><b>Alex Chen</b><small>Operations Manager</small></div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>
  <nav class="mode-chips" id="modeChips"></nav>

  <div class="right-stack">
    <div class="map-tools card" id="mapTools"></div>
    <aside class="detail card" id="detail"></aside>
  </div>

  <section class="tracking card" id="tracking"></section>
  <section class="docks card" id="docks"></section>
  <div class="toasts" id="toasts"></div>
  <div class="cine-bar" id="cineBar"></div>
  <div class="hint">Sit back — it builds itself · Drag/scroll to explore · C auto-camera · U cinema mode</div>

  <script src="js/vendor/three.min.js?v=5.2.1"></script>
  <script src="js/core.js?v=5.2.1"></script>
  <script src="js/models.js?v=5.2.1"></script>
  <script src="js/models_ext.js?v=5.2.1"></script>
  <script src="js/models_fleet.js?v=5.2.1"></script>
  <script src="js/world.js?v=5.2.1"></script>
  <script src="js/data.js?v=5.2.1"></script>
  <script src="js/fx.js?v=5.2.1"></script>
  <script src="js/fac_base.js?v=5.2.1"></script>
  <script src="js/fac_wh.js?v=5.2.1"></script>
  <script src="js/fac_factory.js?v=5.2.1"></script>
  <script src="js/fac_rail.js?v=5.2.1"></script>
  <script src="js/fac_port.js?v=5.2.1"></script>
  <script src="js/fac_air.js?v=5.2.1"></script>
  <script src="js/fac_misc.js?v=5.2.1"></script>
  <script src="js/fac_more.js?v=5.2.1"></script>
  <script src="js/supply.js?v=5.2.1"></script>
  <script src="js/traffic.js?v=5.2.1"></script>
  <script src="js/growth.js?v=5.2.1"></script>
  <script src="js/cinema.js?v=5.2.1"></script>
  <script src="js/ui.js?v=5.2.1"></script>
  <script src="js/main.js?v=5.2.1"></script>
</body>
</html>
